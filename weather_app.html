<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Weather App</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 400px; margin: 2rem auto; }
        .card { padding: 1.5rem; border: 1px solid #ccc; border-radius: 8px; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
        .error { color: #d32f2f; }
        .loading { color: #1976d2; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Local Weather</h2>
        <button id="fetch-btn">Get Current Weather</button>
        <div id="weather-display" style="margin-top: 1rem;">
            <!-- Data, loading, or errors will inject here -->
        </div>
    </div>

    <script>
        async function fetchWeather() {
            const display = document.getElementById('weather-display');
            const button = document.getElementById('fetch-btn');
            
            display.innerHTML = '<p class="loading">Fetching data...</p>';
            button.disabled = true;

            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=14.46&longitude=75.92&current_weather=true');

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                const weather = data.current_weather;

                display.innerHTML = `
                    <p><strong>Temperature:</strong> ${weather.temperature}°C</p>
                    <p><strong>Wind Speed:</strong> ${weather.windspeed} km/h</p>
                `;
            } catch (error) {
                display.innerHTML = `<p class="error">Failed to load weather: ${error.message}</p>`;
            } finally {
                button.disabled = false;
            }
        }

        document.getElementById('fetch-btn').addEventListener('click', fetchWeather);
    </script>
</body>
</html>
